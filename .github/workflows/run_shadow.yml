name: Run Signal Shadow

on:
  schedule:
    - cron: '15,45 14-20 * * 1-5'
    - cron: '15 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run shadow
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          FORM4API_KEY: ${{ secrets.FORM4API_KEY }}
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot_shadow.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shadow-log-${{ github.run_number }}
          path: shadow_bot.log
          retention-days: 30
          if-no-files-found: ignore
