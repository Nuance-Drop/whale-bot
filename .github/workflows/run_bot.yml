name: Run Whale Bot

on:
  schedule:
    # Runs every 30 minutes, Mon-Fri, 14:30-21:00 UTC (market hours)
    - cron: '30 14-21 * * 1-5'
    - cron: '0 15-20 * * 1-5'
  workflow_dispatch:  # Allows manual trigger from the Actions tab

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install alpaca-py yfinance pandas vaderSentiment

      - name: Run bot
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python bot.py

      - name: Upload trade log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trade-log
          path: |
            trade_log.csv
            bot.log
