name: Run Whale Bot (v10)

on:
  schedule:
    - cron: '0,30 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run bot
        env:
          DRY_RUN: "0"
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          APIFY_API_KEY: ${{ secrets.APIFY_API_KEY }}
          FORM4API_KEY: ${{ secrets.FORM4API_KEY }}
          BARGO_API_KEY: ${{ secrets.BARGO_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KALSHI_API_KEY_ID: ${{ secrets.KALSHI_API_KEY_ID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: python bot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v10-log-${{ github.run_number }}
          path: |
            bot.log
            trade_log.csv
          retention-days: 30
          if-no-files-found: ignore
