name: Run Reflexive Detector

on:
  schedule:
    - cron: '25,55 14-20 * * 1-5'
    - cron: '25 21 * * 1-5'
  workflow_dispatch:

jobs:
  run-reflexive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'
      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Reflexive
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_REFLEXIVE_TABLE_ID: ${{ secrets.AIRTABLE_REFLEXIVE_TABLE_ID }}
          AIRTABLE_RUNS_TABLE_ID: ${{ secrets.AIRTABLE_RUNS_TABLE_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot_reflexive.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reflexive-log-${{ github.run_number }}
          path: reflexive_bot.log
          retention-days: 30
